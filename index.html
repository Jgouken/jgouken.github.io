<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jgouken</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script defer src="script.js"></script>
</head>

<body>
    <div>
        <div class="headerBack" id="playArea">
            <div class="tapScreen" id="tapScreen" style="opacity: 0.5;">TAP/CLICK THE SCREEN</div>
            <div class="fullName" id="fullName">
                JGOUKEN
                <div
                    x-data="{ greeting: (new Date().getHours() > 0 && new Date().getHours() < 6) ? 'GET SOME SLEEP!'.toLocaleUpperCase() : (new Date().getHours() < 12 && new Date().getHours() >= 6) ? 'Good Morning!'.toLocaleUpperCase() : (new Date().getHours() < 18 ? 'Good Afternoon!'.toLocaleUpperCase() : 'Good Evening!'.toLocaleUpperCase()) }"
                    x-text="greeting"
                    style="z-index: 10; position: absolute; left: 50%; transform: translateX(-50%); width: max-content; text-align: center; pointer-events: none; font-family: Pixel-Font; color: white; font-size: 1.25rem; margin-top: 0.5rem;">
                    WHY HELLO HELLO!</div>
            </div>
            <img class="arrow" id="arrow1" src="/images/arrow.png">
            <img class="arrow" id="arrow2" src="/images/arrow.png">
            <img class="arrow" id="arrow3" src="/images/arrow.png">
            <img class="arrow" id="arrow4" src="/images/arrow.png">
            <img class="arrow" id="arrow5" src="/images/arrow.png">
            <img class="arrow" id="arrow6" src="/images/arrow.png">
            <img class="arrow" id="arrow7" src="/images/arrow.png">
            <img class="arrow" id="arrow8" src="/images/arrow.png">
            <img class="arrow" id="arrow9" src="/images/arrow.png">
            <img class="arrow" id="arrow10" src="/images/arrow.png">
            <img class="arrow" id="arrow11" src="/images/arrow.png">
            <img class="arrow" id="arrow12" src="/images/arrow.png">
            <img class="arrow" id="arrow13" src="/images/arrow.png">
            <img class="arrow" id="arrow14" src="/images/arrow.png">
            <img class="arrow" id="arrow15" src="/images/arrow.png">
            <img class="arrow" id="arrow16" src="/images/arrow.png">
            <img class="arrow" id="arrow17" src="/images/arrow.png">
            <img class="arrow" id="arrow18" src="/images/arrow.png">
            <img class="arrow" id="arrow19" src="/images/arrow.png">
            <img class="arrow" id="arrow20" src="/images/arrow.png">
        </div>

        <div class="groundbg" id="groundbg">
            <div class="groundLine" id="groundLine"></div>
            <div class="groundLine2" id="groundLine2"></div>
        </div>

        <div class="full-width-tabs">
            <div class="tabs-grid">
                <a class="tab" href="#musicPortfolio">Description</a>
                <a class="tab" href="#musicPortfolio">Resume</a>
                <a class="tab" href="#musicPortfolio">Programs</a>
                <a class="tab" href="#musicPortfolio">Music</a>
                <a class="tab" href="#musicPortfolio">Games</a>
            </div>
        </div>

        <div class="fullbody">
            <div class="description">
                <p>Site under construction!</p>
            </div>

            <div class="music-portfolio" id="musicPortfolio">
                <canvas id="oscilloscopeCanvas" class="oscilloscope"></canvas>
                <div class="portfolio-overlay">
                    <div class="description"
                        style="font-size: 1.5rem; font-weight: bold; text-align: center; margin-bottom: 0;">
                        How about a little music?
                    </div>
                    <div class="portfolio-carousel">
                        <button class="carousel-nav prev" id="prevTrack" aria-label="Previous track">◄</button>
                        <div class="carousel-card">
                            <div class="track-badge" id="trackBadge">TRACK 1</div>
                            <h3 id="trackTitle">TRACK TITLE</h3>
                            <p id="trackArtist">Jgouken</p>
                            <p id="trackDesc">"Wow! You're really good!"</p>
                        </div>
                        <button class="carousel-nav next" id="nextTrack" aria-label="Next track">►</button>
                    </div>
                    <div class="music-player-container">
                        <div class="music-player-bar" id="musicPlayerBar">
                            <button id="playPauseBtn" class="play-pause">Play</button>
                            <input id="seekBar" class="seek-bar" type="range" min="0" max="100" value="0" step="0.1"
                                aria-label="Seek track">
                            <div class="player-time" id="playerTime">0:00 / 0:00</div>
                        </div>
                    </div>
                </div>
                <audio id="musicPlayer" preload="metadata"></audio>
            </div>

        </div>
    </div>
</body>

</html>
